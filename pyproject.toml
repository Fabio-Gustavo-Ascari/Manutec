[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manutec"
version = "0.1.0"
description = "Sistema desktop de gestão para assistências técnicas"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6==6.12.0",
    "SQLAlchemy==2.0.52",
    "alembic==1.20.0",
    "reportlab==5.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "PyInstaller==6.22.3",
]

[project.scripts]
manutec = "assistencia_manager.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
